; Proyecto Lapiz - J2 Pressure Sensitive Stylus (Taller de Proyecto II)
;
; Cada test es un "environment" distinto. Todos comparten la config de [env]
; y solo compilan su carpeta dentro de src/ (build_src_filter).
; En VS Code: barra inferior de PlatformIO -> selector de entorno (env:...)
; o por terminal:  pio run -e t1_i2c_scanner -t upload -t monitor

[platformio]
default_envs = t1_i2c_scanner

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
monitor_filters = direct
build_flags = -DSERIAL_BAUD=921600

; ---- Test 1: escaner I2C + WHO_AM_I --------------------------------------
[env:t1_i2c_scanner]
build_src_filter = +<t1_i2c_scanner/>

; ---- Test 2: lectura cruda a tasa fija (100 Hz) -> Teleplot ---------------
[env:t2_lectura_cruda]
build_src_filter = +<t2_lectura_cruda/>

; ---- Test 3: calibracion estatica, ruido y deriva del giroscopo -----------
[env:t3_calibracion]
build_src_filter = +<t3_calibracion/>

; ---- Test 4: filtro de Madgwick embebido -> roll/pitch/yaw + log CSV -------
[env:t4_madgwick]
build_src_filter = +<t4_madgwick/>
