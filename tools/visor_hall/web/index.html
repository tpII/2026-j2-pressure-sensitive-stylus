<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SS49E · Hall RAW</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#39d353; --warn:#f0883e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, Segoe UI, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  button, select, input { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--dim); }
  button.primary { background:#238636; border-color:#2ea043; }
  button.danger { background:#da3633; border-color:#f85149; }
  input[type=number] { width:76px; }
  label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  #status { margin-left:auto; color:var(--dim); }
  #status.on { color:var(--acc); }
  .readouts { display:flex; gap:12px; padding:12px 14px; flex-wrap:wrap; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 16px; min-width:150px; }
  .card .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .card .v { font:600 34px/1.1 ui-monospace, Consolas, monospace; font-variant-numeric:tabular-nums; }
  .card .v.small { font-size:20px; padding-top:8px; }
  #wrap { flex:1; margin:0 14px 14px; border:1px solid var(--line); border-radius:8px; background:#010409; position:relative; min-height:200px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #nosupport { display:none; background:var(--warn); color:#000; padding:8px 14px; }
</style>
</head>
<body>
<div id="nosupport">Este navegador no soporta Web Serial API. Usá Chrome o Edge (escritorio) en http://localhost.</div>
<header>
  <h1>SS49E · Hall RAW</h1>
  <button id="btnConn" class="primary">Conectar (COM5)</button>
  <button id="btnPause">Pausa</button>
  <label>Ventana
    <select id="win"><option value="5">5 s</option><option value="10" selected>10 s</option></select>
  </label>
  <label>Unidad Y
    <select id="unit"><option value="V" selected>Voltaje</option><option value="ADC">ADC</option></select>
  </label>
  <label>Escala Y
    <select id="ymode"><option value="manual" selected>Manual</option><option value="auto">Auto</option></select>
  </label>
  <label>min <input id="ymin" type="number" step="0.05" value="1.00"></label>
  <label>max <input id="ymax" type="number" step="0.05" value="3.00"></label>
  <label><input id="dots" type="checkbox" checked> puntos</label>
  <span id="status">Desconectado</span>
</header>

<div class="readouts">
  <div class="card"><div class="k">ADC (0–1023)</div><div class="v" id="vRaw">----</div></div>
  <div class="card"><div class="k">Voltaje</div><div class="v" id="vVolt">-.---<span style="font-size:18px"> V</span></div></div>
  <div class="card"><div class="k">Ventana min / max</div><div class="v small" id="vMinMax">– / –</div></div>
  <div class="card"><div class="k">Pico a pico (ruido)</div><div class="v small" id="vPP">–</div></div>
  <div class="card"><div class="k">Tasa recibida</div><div class="v small" id="vHz">– Hz</div></div>
</div>

<div id="wrap"><canvas id="cv"></canvas></div>

<script>
'use strict';
const BAUD = 115200, VREF = 5.0, ADC_MAX = 1023, PERIOD_MS = 20, MAX_WIN_MS = 10000;
const $ = id => document.getElementById(id);

// ---------- Buffer de muestras (crudas, sin procesar) ----------
// Cada muestra: { t (ms, eje temporal), raw (int) }.
// El firmware muestrea a cadencia fija de 20 ms; el USB entrega en ráfagas,
// así que el eje temporal se reconstruye por índice (t += 20 ms) y se
// resincroniza con el reloj de la PC si deriva más de 250 ms. Los VALORES no se tocan.
let samples = [], lastT = 0, lastArrival = 0, paused = false;
let rateCount = 0, rateT0 = performance.now();

function pushSample(raw) {
  const now = performance.now();
  let t = lastT + PERIOD_MS;
  if (!lastT || Math.abs(t - now) > 250) t = now;
  lastT = t; lastArrival = now;
  samples.push({ t, raw });
  const cutoff = t - MAX_WIN_MS - 500;
  let i = 0; while (i < samples.length && samples[i].t < cutoff) i++;
  if (i) samples.splice(0, i);
  rateCount++;
}

// ---------- Web Serial ----------
let port = null, reader = null, keepReading = false;

async function connect() {
  if (!('serial' in navigator)) return;
  try {
    // El navegador no permite abrir "COM5" por nombre: aparece un selector, elegí COM5.
    // Si ya se autorizó antes, se reutiliza automáticamente.
    const known = await navigator.serial.getPorts();
    port = known.length === 1 ? known[0] : await navigator.serial.requestPort();
    await port.open({ baudRate: BAUD });
    setStatus(true);
    readLoop();
  } catch (e) { console.error(e); setStatus(false, 'Error: ' + e.message); port = null; }
}

async function disconnect() {
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch {}
}

async function readLoop() {
  keepReading = true;
  const decoder = new TextDecoderStream();
  const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  let buf = '';
  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        parseLine(line);
      }
      if (buf.length > 4096) buf = '';
    }
  } catch (e) { console.warn(e); }
  finally {
    try { reader.releaseLock(); } catch {}
    await closed;
    try { await port.close(); } catch {}
    port = null; reader = null;
    setStatus(false);
  }
}

function parseLine(line) {
  if (!line) return;
  let raw;
  if (line[0] === '{') {               // JSON: {"raw":342,"voltage":1.672}
    try { raw = JSON.parse(line).raw; } catch { return; }
  } else {                              // CSV alternativo: 342,1.672
    raw = parseInt(line.split(',')[0], 10);
  }
  if (Number.isInteger(raw) && raw >= 0 && raw <= ADC_MAX) pushSample(raw);
}

function setStatus(on, msg) {
  $('status').textContent = msg || (on ? 'Conectado @ ' + BAUD : 'Desconectado');
  $('status').className = on ? 'on' : '';
  $('btnConn').textContent = on ? 'Desconectar' : 'Conectar (COM5)';
  $('btnConn').className = on ? 'danger' : 'primary';
}

$('btnConn').onclick = () => port ? disconnect() : connect();
$('btnPause').onclick = () => { paused = !paused; $('btnPause').textContent = paused ? 'Reanudar' : 'Pausa'; };
if (!('serial' in navigator)) { $('nosupport').style.display = 'block'; $('btnConn').disabled = true; }
navigator.serial?.addEventListener('disconnect', () => disconnect());

// Cambio de unidad: convierte los límites manuales para no perder el zoom
$('unit').onchange = () => {
  const toADC = $('unit').value === 'ADC';
  for (const id of ['ymin', 'ymax']) {
    const v = parseFloat($(id).value);
    $(id).value = toADC ? Math.round(v * ADC_MAX / VREF) : (v * VREF / ADC_MAX).toFixed(2);
    $(id).step = toADC ? 5 : 0.05;
  }
};

// ---------- Render (canvas, polilínea recta punto a punto, sin suavizado) ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let frozenView = null;

function resize() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe($('wrap'));

const toUnit = raw => $('unit').value === 'ADC' ? raw : raw * VREF / ADC_MAX;

function niceStep(span, target) {
  const s = span / target, p = Math.pow(10, Math.floor(Math.log10(s))), n = s / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

function draw() {
  requestAnimationFrame(draw);
  const W = cv.clientWidth, H = cv.clientHeight;
  const L = 58, R = 12, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const isADC = $('unit').value === 'ADC';
  const winMs = +$('win').value * 1000;

  // Tiempo del borde derecho (scroll suave entre ráfagas USB)
  let tRight;
  if (paused) tRight = frozenView ?? (frozenView = lastT);
  else { frozenView = null; tRight = lastT + Math.min(performance.now() - lastArrival, 60); }
  const tLeft = tRight - winMs;

  const vis = samples.filter(s => s.t >= tLeft - PERIOD_MS && s.t <= tRight);

  // Estadísticas crudas de la ventana
  let mn = Infinity, mx = -Infinity;
  for (const s of vis) { if (s.raw < mn) mn = s.raw; if (s.raw > mx) mx = s.raw; }

  // Escala Y
  let y0, y1;
  if ($('ymode').value === 'auto' && vis.length) {
    const minSpan = isADC ? 8 : 8 * VREF / ADC_MAX;         // al menos ±4 cuentas visibles
    let a = toUnit(mn), b = toUnit(mx);
    if (b - a < minSpan) { const c = (a + b) / 2; a = c - minSpan / 2; b = c + minSpan / 2; }
    const pad = (b - a) * 0.1; y0 = a - pad; y1 = b + pad;
  } else {
    y0 = parseFloat($('ymin').value); y1 = parseFloat($('ymax').value);
    if (!(y1 > y0)) { y0 = 0; y1 = isADC ? ADC_MAX : VREF; }
  }
  const X = t => L + (t - tLeft) / winMs * pw;
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * ph;

  ctx.clearRect(0, 0, W, H);
  ctx.font = '11px Consolas, monospace'; ctx.lineWidth = 1;

  // Grilla Y
  const ys = niceStep(y1 - y0, 8);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = Math.ceil(y0 / ys) * ys; v <= y1 + 1e-9; v += ys) {
    const y = Math.round(Y(v)) + 0.5;
    ctx.strokeStyle = '#21262d'; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.fillStyle = '#8b949e';
    ctx.fillText(isADC ? v.toFixed(0) : v.toFixed(ys < 0.1 ? 3 : 2) + ' V', L - 6, y);
  }
  // Grilla X (segundos relativos)
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let s = 0; s <= winMs / 1000; s++) {
    const x = Math.round(L + pw - s * 1000 / winMs * pw) + 0.5;
    ctx.strokeStyle = '#21262d'; ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
    ctx.fillStyle = '#8b949e'; ctx.fillText(s ? '-' + s + 's' : '0', x, T + ph + 6);
  }
  ctx.strokeStyle = '#30363d'; ctx.strokeRect(L + 0.5, T + 0.5, pw, ph);

  // Señal
  ctx.save();
  ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  if (vis.length) {
    ctx.strokeStyle = '#39d353'; ctx.lineWidth = 1.25; ctx.lineJoin = 'miter';
    ctx.beginPath();
    vis.forEach((s, i) => { const x = X(s.t), y = Y(toUnit(s.raw)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    if ($('dots').checked) {
      ctx.fillStyle = '#7ee787';
      for (const s of vis) ctx.fillRect(X(s.t) - 1.5, Y(toUnit(s.raw)) - 1.5, 3, 3);
    }
  }
  ctx.restore();

  // Indicadores
  if (!paused && samples.length) {
    const raw = samples[samples.length - 1].raw;
    $('vRaw').textContent = String(raw).padStart(4, ' ');
    $('vVolt').firstChild.nodeValue = (raw * VREF / ADC_MAX).toFixed(3);
  }
  if (vis.length) {
    $('vMinMax').textContent = `${mn} / ${mx}  (${(mn*VREF/ADC_MAX).toFixed(2)}–${(mx*VREF/ADC_MAX).toFixed(2)} V)`;
    $('vPP').textContent = `${mx - mn} cuentas · ${((mx - mn) * VREF / ADC_MAX * 1000).toFixed(1)} mV`;
  }
  const now = performance.now();
  if (now - rateT0 >= 1000) {
    $('vHz').textContent = (rateCount * 1000 / (now - rateT0)).toFixed(1) + ' Hz';
    rateCount = 0; rateT0 = now;
  }
}
requestAnimationFrame(draw);
</script>
</body>
</html>
